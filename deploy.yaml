# Old standalone "db" service removed — AirTrail now uses the shared_postgres
# container from deploy-shared-postgres.yaml.
# Requires: CREATE DATABASE airtrail OWNER airtrailuser; in that stack's init.sql,
# and the "shared-postgres_net" external network below.

services:
  airtrail:
    image: johly/airtrail:latest
    container_name: AirTrail
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/3000' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    environment:
      - ORIGIN=https://airtrail.ashish-syn-nas.synology.me
      - DB_URL=postgres://airtrailuser:${sharedpgadminpass}@shared_postgres:5432/airtrail
      - DB_DATABASE_NAME=airtrail
      - DB_USERNAME=airtrailuser
      - DB_PASSWORD=${sharedpgadminpass}
    ports:
      - 3857:3000
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - default
      - shared-postgres_net
    restart: on-failure:5

networks:
  shared-postgres_net:
    external: true
